{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}АК Галерея — Кыргызстан{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<nav class="navbar navbar-expand-lg border-bottom">
    <div class="container-fluid px-4">
        <a href="/" class="nav-logo">
            <img src="{% static 'images/logo_white.svg' %}" alt="АК" style="height: 32px;">
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <div class="navbar-nav ms-auto gap-4">
                <a href="/about/" class="nav-link-item">О галерее</a>
                <a href="/shop/" class="nav-link-item">Магазин</a>
                <a href="/exhibitions/" class="nav-link-item">Выставки</a>
                <a href="/artists/" class="nav-link-item">Мастера</a>
                <a href="/contacts/" class="nav-link-item">Контакты</a>
            </div>
        </div>
    </div>
</nav>

<main>
    {% block content %}
    {% endblock %}
</main>

<footer class="footer mt-5 border-top py-4">
    <div class="container-fluid px-4">
        <div class="row">
            <div class="col-md-4 mb-3">
                <span class="footer-logo">АК</span>
            </div>
            <div class="col-md-4 mb-3 d-flex flex-column gap-2">
                <a href="/about/" class="nav-link-item">О галерее</a>
                <a href="/shop/" class="nav-link-item">Магазин</a>
                <a href="/exhibitions/" class="nav-link-item">Выставки</a>
                <a href="/artists/" class="nav-link-item">Мастера</a>
                <a href="/contacts/" class="nav-link-item">Контакты</a>
            </div>
            <div class="col-md-4 mb-3 d-flex flex-column gap-2">
                <p class="footer-text">Бишкек, Кыргызстан</p>
                <a href="mailto:info@akgallery.kg" class="footer-link">info@akgallery.kg</a>
            </div>
        </div>
        <div class="border-top pt-3 mt-2">
            <p class="footer-text">© 2026 АК Галерея — Кыргызстан</p>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.querySelectorAll('.artwork-slider').forEach(slider => {
    const slides = slider.querySelectorAll('.slide');
    const dots = slider.querySelectorAll('.dot');
    if (slides.length <= 1) {
        slider.querySelector('.slide-btn.slide-prev')?.remove();
        slider.querySelector('.slide-btn.slide-next')?.remove();
        slider.querySelector('.slide-dots')?.remove();
        return;
    }
    let current = 0;
    function goTo(n) {
        slides[current].classList.remove('active');
        dots[current].classList.remove('active');
        current = (n + slides.length) % slides.length;
        slides[current].classList.add('active');
        dots[current].classList.add('active');
    }
    slider.querySelector('.slide-prev').addEventListener('click', () => goTo(current - 1));
    slider.querySelector('.slide-next').addEventListener('click', () => goTo(current + 1));
    dots.forEach((dot, i) => dot.addEventListener('click', () => goTo(i)));
});
</script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const hero = document.querySelector('.exh-hero');
    if (!hero) return;

    const image = hero.querySelector('.exh-hero-image img');
    const overlay = hero.querySelector('.exh-hero-overlay');
    if (!image) return;

    const imageStrength = 65;
    const overlayStrength = 25;

    document.addEventListener('mousemove', function(e) {
        const x = (e.clientX / window.innerWidth) - 0.5;
        const y = (e.clientY / window.innerHeight) - 0.5;

        image.style.transform = 'scale(1.08) translate(' + (x * imageStrength) + 'px, ' + (y * imageStrength) + 'px)';
        if (overlay) {
            overlay.style.transform = 'translate(' + (-x * overlayStrength) + 'px, ' + (-y * overlayStrength) + 'px)';
        }
    });
});
</script>

</body>
</html>
