{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}АК Галерея — TUMAR ART GROUP{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<nav class="navbar navbar-expand-lg border-bottom">
    <div class="container-fluid px-4">
        <a href="/" class="nav-logo">
            <img src="{% static 'images/logo_white.svg' %}" alt="АК" style="height: 32px;">
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <div class="navbar-nav ms-auto gap-4">
                <a href="/artists/" class="nav-link-item">Мастера</a>
                <a href="/exhibitions/" class="nav-link-item">Выставки</a>
                <a href="/shop/" class="nav-link-item">Магазин</a>
                <a href="/about/" class="nav-link-item">О галерее</a>
                <a href="/contacts/" class="nav-link-item">Контакты</a>
            </div>
        </div>
    </div>
</nav>

<main>
    {% block content %}
    {% endblock %}
</main>

<footer class="footer mt-5 border-top py-4">
    <div class="container-fluid px-4">
        <div class="row">
            <div class="col-md-4 mb-3">
                <span class="footer-logo">АК</span>
                <p class="footer-sub mt-1">TUMAR ART GROUP</p>
            </div>
            <div class="col-md-4 mb-3 d-flex flex-column gap-2">
                <a href="/artists/" class="footer-link">Мастера</a>
                <a href="/exhibitions/" class="footer-link">Выставки</a>
                <a href="/shop/" class="footer-link">Магазин</a>
                <a href="/about/" class="footer-link">О галерее</a>
                <a href="/contacts/" class="footer-link">Контакты</a>
            </div>
            <div class="col-md-4 mb-3 d-flex flex-column gap-2">
                <p class="footer-text">Бишкек, Кыргызстан</p>
                <a href="mailto:info@akgallery.kg" class="footer-link">info@akgallery.kg</a>
            </div>
        </div>
        <div class="border-top pt-3 mt-2">
            <p class="footer-text">© 2026 АК Галерея — TUMAR ART GROUP</p>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.querySelectorAll('.artwork-slider').forEach(slider => {
    const slides = slider.querySelectorAll('.slide');
    const dots = slider.querySelectorAll('.dot');
    if (slides.length <= 1) {
        slider.querySelector('.slide-btn.slide-prev')?.remove();
        slider.querySelector('.slide-btn.slide-next')?.remove();
        slider.querySelector('.slide-dots')?.remove();
        return;
    }
    let current = 0;
    function goTo(n) {
        slides[current].classList.remove('active');
        dots[current].classList.remove('active');
        current = (n + slides.length) % slides.length;
        slides[current].classList.add('active');
        dots[current].classList.add('active');
    }
    slider.querySelector('.slide-prev').addEventListener('click', () => goTo(current - 1));
    slider.querySelector('.slide-next').addEventListener('click', () => goTo(current + 1));
    dots.forEach((dot, i) => dot.addEventListener('click', () => goTo(i)));
});
</script>
</body>
</html>
